name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format gate
        run: cargo fmt --check
      - name: Rust tests
        run: cargo test
      - name: Web console (tests + build)
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  windows:
    # Build-level support only: Windows is adapted but untested on real
    # hardware (see README "平台支持"). This job keeps the port compiling.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check all targets
        run: cargo check --all-targets
      - name: Build
        run: cargo build
