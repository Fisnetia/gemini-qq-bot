[package]
name = "gemini-qq-bot"
version = "0.1.0"
edition = "2024"
publish = false
description = "Gemini QQ group bot: OneBot v11 bridge, Agy CLI adapter, SQLite state, internal admin API"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.22"
axum = "0.8.9"
tower-http = { version = "0.6", features = ["fs"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
portable-pty = "0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = 2
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
